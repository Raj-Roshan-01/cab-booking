services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: cab, POSTGRES_USER: cab, POSTGRES_PASSWORD: cab }
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    environment:
      DB_URL: jdbc:postgresql://db:5432/cab
      DB_USER: cab
      DB_PASSWORD: cab
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-to-something-long-and-random}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  nginx:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
volumes: { pgdata: {} }

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:cab;DB_CLOSE_DELAY=-1}   # set DB_URL=jdbc:postgresql://host:5432/cab for PostgreSQL / Supabase
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari: { maximum-pool-size: 10 }
  jpa:
    open-in-view: false
    hibernate.ddl-auto: update
    properties.hibernate.jdbc.batch_size: 20
app:
  jwt: { secret: "${JWT_SECRET:change-me-change-me-change-me-change-me-0123456789}", expiry-ms: 86400000 }
  admin: { email: "${ADMIN_EMAIL:admin@cab.com}", password: "${ADMIN_PASSWORD:Admin@123}" }
  mail-from: ${MAIL_FROM:no-reply@cabgo.local}
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}        # blank = demo payment mode
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
management.endpoints.web.exposure.include: health
---
spring.config.activate.on-profile: oauth   # Google social login: SPRING_PROFILES_ACTIVE=oauth
spring.security.oauth2.client.registration.google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  scope: openid,profile,email
---
spring.config.activate.on-profile: mail    # receipt e-mails: SPRING_PROFILES_ACTIVE=mail
spring.mail:
  host: ${MAIL_HOST}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USER}
  password: ${MAIL_PASSWORD}
  properties.mail.smtp: { auth: true, starttls.enable: true }
